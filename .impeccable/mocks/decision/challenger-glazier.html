<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Vách kính</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#151515;font-family:"Be Vietnam Pro";color:#151515}
.wall{display:grid;grid-template-columns:2.2fr 1fr 1fr;grid-template-rows:110px 1fr 1fr;gap:16px;padding:16px;height:900px}
.p{background:#fff;padding:28px 32px}
.p.m{background:#FFF8D6}
.nav{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:18px}
.nav b{font-family:Nunito;font-size:36px}
.hero{grid-row:2/4;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-family:Nunito;font-weight:900;font-size:104px;line-height:.98}
.y{background:#FFD400;display:flex;align-items:flex-end;font-family:Nunito;font-weight:900;font-size:40px}
.p h2{font-family:Nunito;font-weight:800;font-size:34px}
</style></head><body>
<div class="wall">
 <div class="p nav"><b>SeeVia</b><span>Sản phẩm · Công nghệ · Cộng đồng · Liên hệ · VI | EN</span></div>
 <div class="p m hero"><h1>Một chiếc kính đọc thế giới bằng tiếng Việt.</h1></div>
 <div class="p"><h2>Đọc chữ in</h2></div>
 <div class="p m"><h2>Nhận diện vật cản</h2></div>
 <div class="p"><h2>Mô tả không gian</h2></div>
 <div class="p y">Hỏi SeeVia AI →</div>
</div>
</body></html>
