<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Áp phích chữ gỗ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Be+Vietnam+Pro:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#FFF8D6;color:#151515;font-family:Nunito;font-weight:900}
.bar{display:flex;justify-content:space-between;padding:26px 60px;border-bottom:6px solid #151515;font-family:"Be Vietnam Pro";font-size:18px}
.band{margin:0 60px;border-bottom:6px solid #151515;line-height:.86;text-transform:uppercase;white-space:nowrap;position:relative}
.b1{font-size:250px;letter-spacing:-.02em}
.b2{font-size:178px;background:#FFD400;margin:0;padding:0 60px}
.b2 span{position:relative;left:6px;top:4px}
.b3{font-size:150px;display:flex;justify-content:space-between;align-items:center}
.b3 em{font-style:normal;font-size:30px;background:#151515;color:#FFD400;border-radius:999px;padding:18px 34px;text-transform:none}
</style></head><body>
<div class="bar"><span>SeeVia · Kính trợ lý thị giác</span><span>Sản phẩm · Công nghệ · Cộng đồng · Liên hệ · VI | EN</span></div>
<div class="band b1">SeeVia đọc</div>
<div class="band b2"><span>chữ in, biển báo</span></div>
<div class="band b3">cho bạn <em>Hỏi SeeVia AI</em></div>
</body></html>
