<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Chuẩn ngành</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#151515;font-family:"Be Vietnam Pro"}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 96px;font-weight:600;font-size:17px}
header b{font-family:Nunito;font-size:32px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:60px 96px 0;align-items:center}
h1{font-family:Nunito;font-weight:900;font-size:76px;line-height:1.02}
.hero p{font-size:22px;margin:24px 0 34px;line-height:1.5}
.btn{display:inline-block;font-family:Nunito;font-weight:900;font-size:22px;background:#151515;color:#FFD400;border-radius:999px;padding:18px 32px}
.img{height:420px;border-radius:28px;background:#FFF8D6;display:grid;place-items:center;font-family:Nunito;font-weight:800;font-size:28px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:44px 96px}
.cards div{border:2px solid #eee;border-radius:20px;padding:24px;font-family:Nunito;font-weight:800;font-size:24px}
</style></head><body>
<header><b>SeeVia</b><span>Sản phẩm · Công nghệ · Cộng đồng · Liên hệ · VI | EN</span></header>
<div class="hero"><div><h1>Kính trợ lý thị giác cho người Việt</h1><p>Đọc chữ, nhận diện vật cản và mô tả xung quanh bằng giọng nói.</p><span class="btn">Khám phá sản phẩm</span></div><div class="img">Ảnh kính SeeVia</div></div>
<div class="cards"><div>Đọc văn bản</div><div>Nhận diện vật cản</div><div>Trợ lý giọng nói</div></div>
</body></html>
